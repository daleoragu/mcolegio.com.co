name: Pruebas de la plataforma

# Corre las pruebas de Django (con SQLite) en cada cambio de una rama de trabajo.
# No usa claves ni la base de datos de producción.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
    paths:
      - '**.py'
      - '**.html'
      - 'requirements.txt'
      - '.github/workflows/plataforma.yml'

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Librerías del sistema (PDF)
        run: sudo apt-get update -q && sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev
      - name: Instalar
        run: python -m pip install -r requirements.txt
      - name: Revisar el proyecto
        run: python manage.py check
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: |
          set -o pipefail
          python manage.py test --noinput notas certificados actas horarios calendario circulares cartera \
            elecciones piar prematricula salon_digital simat puntoexacto aula materiales 2>&1 | tee salida_pruebas.txt \
            || { python .github/scripts/anotar_pruebas.py salida_pruebas.txt; exit 1; }
          python .github/scripts/anotar_pruebas.py salida_pruebas.txt
