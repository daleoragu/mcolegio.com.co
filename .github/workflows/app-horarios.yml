name: App de horarios (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'app_horarios/**'
      - 'horarios/motor.py'
      - 'horarios/nucleo.py'
      - 'horarios/proyecto.py'
      - '.github/workflows/app-horarios.yml'

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar
        run: python -m pip install pyinstaller openpyxl
      - name: Probar la ventana
        timeout-minutes: 15
        working-directory: app_horarios
        run: python prueba_ventana.py
      - name: Construir el .exe
        working-directory: app_horarios
        run: python -m PyInstaller --noconfirm --onefile --windowed --name GeneradorHorarios --paths .. --hidden-import horarios.proyecto --hidden-import horarios.nucleo --hidden-import horarios.motor generador_horarios.py
      - uses: actions/upload-artifact@v4
        with:
          name: GeneradorHorarios
          path: app_horarios/dist/GeneradorHorarios.exe
