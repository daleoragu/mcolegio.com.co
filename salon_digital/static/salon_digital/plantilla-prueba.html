<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de ejemplo</title>
<style>
:root{--acento:#9E1982;--oscuro:#5C1416;--linea:#E6D6E2;--fondo:#FBF7FA;--tenue:#6B5566}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:#2A1620;font-family:'Segoe UI',system-ui,Arial,sans-serif;
     font-size:17px;line-height:1.6}
.caja{max-width:760px;margin:0 auto;padding:24px 18px 60px}
h1{color:var(--oscuro);font-size:26px;margin:18px 0 6px}
p.sub{color:var(--tenue);margin:0 0 22px}
.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:14px;color:var(--oscuro);margin-bottom:6px}
input{width:100%;padding:12px 14px;font-size:17px;border:1.5px solid var(--linea);border-radius:10px;
      font-family:inherit}
input:focus{outline:none;border-color:var(--acento)}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.fila{grid-template-columns:1fr}}
button{font-family:inherit;font-size:17px;font-weight:600;border:none;border-radius:10px;
       padding:13px 26px;cursor:pointer;background:var(--acento);color:#fff}
button:hover{background:var(--oscuro)}
.opcion{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
        border:2px solid var(--linea);border-radius:12px;padding:14px 16px;margin-bottom:10px;
        color:inherit;font-weight:400}
.opcion:hover{border-color:var(--acento);background:#F7EFF5}
.opcion.elegida{border-color:var(--acento);background:#F7EFF5}
.opcion .letra{flex:0 0 32px;height:32px;border-radius:50%;background:var(--oscuro);color:#fff;
               display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.oculto{display:none}
.barra{height:8px;background:#F7EFF5;border-radius:99px;overflow:hidden;margin-bottom:16px}
.barra i{display:block;height:100%;background:var(--acento);width:0;transition:width .3s}
.marcador{font-size:44px;font-weight:700;color:var(--acento);margin:6px 0}
.aviso{font-size:14.5px;color:var(--tenue);margin-top:14px}
.revision{border-left:5px solid #2E7D32;background:#fff;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.revision.mal{border-left-color:#B3261E}
</style>
</head>
<body>
<div class="caja">

<!-- ====================== 1. DATOS DEL ESTUDIANTE ====================== -->
<section id="inicio">
  <h1>Prueba de ejemplo</h1>
  <p class="sub">Cambia el título, las preguntas y los colores. Lo demás ya funciona.</p>

  <div class="tarjeta">
    <div class="fila">
      <div><label for="ape">Apellidos</label><input id="ape" autocomplete="off"></div>
      <div><label for="nom">Nombres</label><input id="nom" autocomplete="off"></div>
    </div>
    <div class="fila" style="margin-top:14px">
      <div><label for="gru">Grupo</label><input id="gru" placeholder="7-01" autocomplete="off"></div>
      <div><label for="sede">Sede</label><input id="sede" value="Sede Principal"></div>
    </div>
  </div>

  <div class="tarjeta" style="text-align:center">
    <button onclick="empezar()">Comenzar</button>
  </div>
</section>

<!-- ====================== 2. PREGUNTAS ====================== -->
<section id="prueba" class="oculto">
  <div class="barra"><i id="progreso"></i></div>
  <p class="sub" id="contador"></p>
  <div class="tarjeta">
    <p id="enunciado" style="font-size:19px"></p>
    <p id="pregunta" style="font-weight:700"></p>
    <div id="opciones"></div>
  </div>
  <div style="text-align:center">
    <button id="siguiente" onclick="siguiente()">Siguiente</button>
  </div>
</section>

<!-- ====================== 3. RESULTADO ====================== -->
<section id="resultado" class="oculto">
  <h1>Tus resultados</h1>
  <div class="tarjeta" style="text-align:center">
    <p class="sub" id="datos-final"></p>
    <p class="marcador" id="porcentaje"></p>
    <p class="sub" id="aciertos"></p>
    <p class="aviso" id="aviso"></p>
  </div>
  <div class="tarjeta">
    <h2 style="font-size:17px;color:var(--oscuro);margin:0 0 12px">Revisión</h2>
    <div id="revision"></div>
  </div>
</section>

</div>

<script>
/* ===================================================================
   AQUÍ VAN TUS PREGUNTAS. Agrega las que quieras con el mismo formato.

     id    : un número que identifica la pregunta en los informes
     comp  : la competencia o el eje (lo que tú quieras agrupar)
     apr   : el aprendizaje que evalúa, como lo escribirías en tu planeación
     enun  : el contexto
     preg  : la pregunta concreta
     ops   : las opciones, en orden A, B, C, D
     clave : la letra correcta
     expl  : la explicación que verá el estudiante al terminar
   =================================================================== */
const PREGUNTAS = [
  {
    id: 1, comp: 'NUM', apr: 'Reconocer la fracción que representa una parte de un total.',
    enun: 'En un salón de 20 estudiantes, 5 pertenecen al grupo de danzas.',
    preg: '¿Qué fracción del salón pertenece al grupo de danzas?',
    ops: ['1/5', '1/4', '5/15', '4/20'],
    clave: 'B',
    expl: '5 de 20 se simplifica dividiendo ambos por 5: queda 1/4.'
  },
  {
    id: 2, comp: 'GEO', apr: 'Calcular el perímetro de un rectángulo.',
    enun: 'La cancha del colegio mide 30 metros de largo y 15 de ancho.',
    preg: '¿Cuántos metros recorre quien le da una vuelta completa?',
    ops: ['45 metros', '90 metros', '450 metros', '60 metros'],
    clave: 'B',
    expl: 'El perímetro suma los cuatro lados: 30 + 15 + 30 + 15 = 90.'
  },
  {
    id: 3, comp: 'DAT', apr: 'Leer el valor máximo en una tabla de datos.',
    enun: 'En la tienda escolar se vendieron 12 jugos, 8 panes, 15 arepas y 6 galletas.',
    preg: '¿Cuál producto se vendió más?',
    ops: ['Los jugos', 'Los panes', 'Las arepas', 'Las galletas'],
    clave: 'C',
    expl: '15 es el número mayor de la lista, y corresponde a las arepas.'
  },
];

/* ===================================================================
   DE AQUÍ PARA ABAJO NO HACE FALTA CAMBIAR NADA.
   =================================================================== */
const ENDPOINT = '';      // Salón Digital lo completa al subir el archivo
const CLAVE_PANEL = '';   // Salón Digital lo completa al subir el archivo

const LETRAS = ['A', 'B', 'C', 'D', 'E', 'F'];
let indice = 0, marcadas = [], intentos = [], inicio = 0;
const $ = function (id) { return document.getElementById(id); };
const limpio = function (t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
};

function empezar() {
  for (const campo of ['ape', 'nom']) {
    if (!$(campo).value.trim()) { $(campo).focus(); $(campo).style.borderColor = '#B3261E'; return; }
  }
  marcadas = new Array(PREGUNTAS.length).fill('—');
  intentos = new Array(PREGUNTAS.length).fill(0);
  indice = 0;
  inicio = Date.now();
  $('inicio').classList.add('oculto');
  $('prueba').classList.remove('oculto');
  pintar();
}

function pintar() {
  const q = PREGUNTAS[indice];
  $('contador').textContent = 'Pregunta ' + (indice + 1) + ' de ' + PREGUNTAS.length;
  $('progreso').style.width = (indice / PREGUNTAS.length * 100) + '%';
  $('enunciado').textContent = q.enun || '';
  $('pregunta').textContent = q.preg || '';
  $('siguiente').textContent = (indice === PREGUNTAS.length - 1) ? 'Terminar' : 'Siguiente';

  $('opciones').innerHTML = q.ops.map(function (texto, i) {
    const letra = LETRAS[i];
    const elegida = marcadas[indice] === letra ? ' elegida' : '';
    return '<button class="opcion' + elegida + '" data-letra="' + letra + '">' +
             '<span class="letra">' + letra + '</span><span>' + limpio(texto) + '</span>' +
           '</button>';
  }).join('');

  document.querySelectorAll('.opcion').forEach(function (b) {
    b.onclick = function () {
      intentos[indice]++;
      marcadas[indice] = b.dataset.letra;
      pintar();
    };
  });
}

function siguiente() {
  if (indice === PREGUNTAS.length - 1) return terminar();
  indice++;
  pintar();
  window.scrollTo({ top: 0 });
}

function terminar() {
  const segundos = Math.floor((Date.now() - inicio) / 1000);

  /* --- Así se arma el resultado que entiende Salón Digital --- */
  const preguntas = PREGUNTAS.map(function (q, i) {
    return { id: q.id, comp: q.comp, apr: q.apr, clave: q.clave, expl: q.expl,
             intentos: intentos[i], seg: 0 };
  });

  const resultado = SalonDigital.armar(preguntas, marcadas, {
    ape: $('ape').value.trim(),
    nom: $('nom').value.trim(),
    gru: $('gru').value.trim(),
    sede: $('sede').value.trim(),
    nombrePrueba: document.title,
    segundos: segundos,
    cambios: intentos.reduce(function (a, b) { return a + b; }, 0) - PREGUNTAS.length,
  });

  SalonDigital.enviar(resultado).then(function (estado) {
    $('aviso').textContent =
      estado === 'enviado' ? 'Resultado enviado al docente.' :
      estado === 'pendiente' ? 'No hay internet. El resultado quedó guardado y se enviará solo.' :
      'Este archivo todavía no está publicado en Salón Digital.';
  });

  /* --- Y así se muestra en pantalla --- */
  $('prueba').classList.add('oculto');
  $('resultado').classList.remove('oculto');
  $('datos-final').textContent = resultado.completo +
    (resultado.gru ? ' · Grupo ' + resultado.gru : '') +
    ' · ' + Math.floor(segundos / 60) + ' min';
  $('porcentaje').textContent = resultado.pct + ' %';
  $('aciertos').textContent = resultado.ok + ' de ' + resultado.total + ' respuestas correctas';

  $('revision').innerHTML = resultado.det.map(function (d, i) {
    return '<div class="revision' + (d.ac ? '' : ' mal') + '">' +
      '<b>Pregunta ' + (i + 1) + ' · ' + (d.ac ? 'correcta' : 'incorrecta') + '</b>' +
      '<p style="margin:6px 0 0;font-size:15px">Marcaste <b>' + d.marcada +
      '</b>. La respuesta correcta es <b>' + d.clave + '</b>.</p>' +
      (d.expl ? '<p style="margin:6px 0 0;font-size:15px;color:var(--tenue)">' +
                limpio(d.expl) + '</p>' : '') +
    '</div>';
  }).join('');
}
</script>

<!-- El motor de envío. No lo borres. -->
<script>/*!
 * Salón Digital — envío de resultados
 * Pega este archivo (o su contenido) en tu actividad y llama a SalonDigital.enviar()
 * cuando el estudiante termine. Al subir el archivo, Salón Digital completa solo
 * las dos constantes de abajo.
 */
const SalonDigital = (function () {
  const COLA = 'salon_cola';

  function leerCola() {
    try { return JSON.parse(localStorage.getItem(COLA) || '[]'); } catch (e) { return []; }
  }
  function escribirCola(lista) {
    try { localStorage.setItem(COLA, JSON.stringify(lista)); } catch (e) {}
  }

  async function mandar(datos) {
    const r = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(datos),
    });
    if (!r.ok) throw new Error('respuesta ' + r.status);
    return true;
  }

  /* Reintenta lo que quedó pendiente de una sesión anterior sin internet. */
  async function reintentar() {
    if (!ENDPOINT) return;
    const pendientes = leerCola();
    if (!pendientes.length) return;
    const quedan = [];
    for (const datos of pendientes) {
      try { await mandar(datos); } catch (e) { quedan.push(datos); }
    }
    escribirCola(quedan);
  }

  /*
   * Envía un resultado. Devuelve 'enviado', 'pendiente' o 'sin-endpoint'.
   * Nunca lanza error: si no hay internet, lo guarda para el próximo intento.
   */
  async function enviar(datos) {
    if (!ENDPOINT) return 'sin-endpoint';
    if (!datos.fecha) datos.fecha = new Date().toISOString();
    try {
      await mandar(datos);
      return 'enviado';
    } catch (e) {
      const pendientes = leerCola();
      pendientes.push(datos);
      escribirCola(pendientes);
      return 'pendiente';
    }
  }

  /*
   * Arma el objeto de resultado a partir de las preguntas y las respuestas.
   *
   *   preguntas: [{id, comp, apr, clave, expl}]
   *   marcadas : ['A', 'C', '—', ...]  en el mismo orden
   *   datos    : {ape, nom, gru, sede, nombrePrueba, segundos}
   */
  function armar(preguntas, marcadas, datos) {
    let ok = 0;
    const det = preguntas.map(function (q, i) {
      const marcada = marcadas[i] || '—';
      const acierto = marcada === q.clave;
      if (acierto) ok++;
      return {
        n: q.id, apr: q.apr || '', comp: q.comp || '',
        ac: acierto, marcada: marcada, clave: q.clave,
        expl: q.expl || '', intentos: q.intentos || 1, seg: q.seg || 0,
      };
    });

    const completo = ((datos.ape || '') + ' ' + (datos.nom || '')).replace(/\s+/g, ' ').trim();
    return {
      ape: datos.ape || '', nom: datos.nom || '', completo: completo,
      sede: datos.sede || '', gru: datos.gru || '',
      prueba: datos.prueba || 'p1',
      pruebaNombre: datos.nombrePrueba || document.title,
      fecha: new Date().toISOString(),
      ok: ok, total: preguntas.length,
      pct: Math.round((ok / preguntas.length) * 1000) / 10,
      seg: datos.segundos || 0,
      cambios: datos.cambios || 0,
      vez: datos.vez || 1,
      det: det,
    };
  }

  if (document.readyState !== 'loading') reintentar();
  else document.addEventListener('DOMContentLoaded', reintentar);

  return { enviar: enviar, armar: armar, reintentar: reintentar };
})();
</script>

</body>
</html>
