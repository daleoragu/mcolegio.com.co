{% if proveedores %}
<div class="d-grid gap-2 mb-3">
  {% for clave, nombre in proveedores %}
    {% if clave == 'google' %}
    <a href="{% url 'salon_digital:social_iniciar' 'google' %}{% if request.GET.siguiente %}?siguiente={{ request.GET.siguiente|urlencode }}{% endif %}" class="btn btn-light border d-flex align-items-center justify-content-center gap-2 py-2 fw-semibold">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 2.9-2.2 5.4-4.7 7.1l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.5z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      Continuar con Google
    </a>
    {% elif clave == 'facebook' %}
    <a href="{% url 'salon_digital:social_iniciar' 'facebook' %}{% if request.GET.siguiente %}?siguiente={{ request.GET.siguiente|urlencode }}{% endif %}" class="btn d-flex align-items-center justify-content-center gap-2 py-2 fw-semibold text-white" style="background:#1877F2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
      Continuar con Facebook
    </a>
    {% endif %}
  {% endfor %}
</div>
<div class="d-flex align-items-center gap-2 text-muted small mb-3"><hr class="flex-grow-1"><span>o con tu correo</span><hr class="flex-grow-1"></div>
{% endif %}
