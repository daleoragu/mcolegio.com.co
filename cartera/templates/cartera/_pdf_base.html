{% load cartera_tags %}<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>{% block titulo %}{% endblock %}</title>
<style>
    @page { size: letter portrait; margin: 1.5cm 1.8cm; }
    body { font-family: Helvetica, Arial, sans-serif; font-size: 10.5px; color: #222; line-height: 1.45; }
    .encabezado-con-bordes, .encabezado-sin-bordes { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
    .encabezado-con-bordes td, .encabezado-sin-bordes td { vertical-align: middle; padding: 0 4px; border: none; }
    .escudo { max-width: 85px; max-height: 75px; height: auto; width: auto; }
    h1 { text-align: center; font-size: 15px; letter-spacing: 1px; margin: 14px 0 10px; }
    table.t { width: 100%; border-collapse: collapse; margin: 8px 0; }
    table.t th { background: #eef1f6; font-size: 9px; text-transform: uppercase; }
    table.t th, table.t td { border: 1px solid #b9c0cc; padding: 4px 6px; }
    .num { text-align: right; white-space: nowrap; }
    .datos td { padding: 2px 6px; }
    .total { font-size: 13px; font-weight: bold; }
    .mora { color: #b42318; font-weight: bold; }
    .firma { margin-top: 60px; text-align: center; }
    .linea { border-top: 1px solid #222; width: 260px; margin: 0 auto 3px; }
    .pie { margin-top: 18px; font-size: 8.5px; color: #555; }
</style></head>
<body>
{% include "notas/fragmentos/encabezado_pdf.html" %}
{% block cuerpo %}{% endblock %}
</body></html>
