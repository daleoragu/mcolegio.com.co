{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    {% include "notas/includes/_head.html" %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="robots" content="noindex">
    <style>
        :root {
            --c1: {{ colegio.color_primario|default:'#193661' }};
            --c1-texto: {{ colegio.color_texto_primario|default:'#FFFFFF' }};
            --fondo: {{ colegio.color_fondo|default:'#F4F6FA' }};
        }
        body { background: var(--fondo); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#1f2937; }
        .pm-cabeza { background: var(--c1); color: var(--c1-texto); padding: 14px 0; }
        .pm-cabeza a { color: var(--c1-texto); text-decoration: none; }
        .pm-cabeza img { height: 46px; width: auto; background:#fff; border-radius: 8px; padding: 3px; }
        .pm-cont { max-width: 860px; margin: 0 auto; padding: 0 16px; }
        .pm-tarjeta { background: #fff; border-radius: 14px; padding: 22px; box-shadow: 0 2px 10px rgba(16,24,40,.06); margin-bottom: 18px; }
        .pm-tarjeta h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; display:flex; align-items:center; gap:10px; }
        .pm-num { width: 30px; height: 30px; border-radius: 50%; background: var(--c1); color: var(--c1-texto);
                  display: inline-flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink:0; }
        .btn-pm { background: var(--c1); border-color: var(--c1); color: var(--c1-texto); font-weight: 600; }
        .btn-pm:hover { filter: brightness(1.1); color: var(--c1-texto); }
        .form-label { font-weight: 600; font-size: .92rem; margin-bottom: 4px; }
        .errorlist { color: #b42318; font-size: .85rem; list-style: none; padding: 0; margin: 4px 0 0; }
        .pm-opciones > div { display: flex; flex-wrap: wrap; gap: 6px 18px; }
        .pm-opciones label { font-weight: 400; }
        .pm-opciones input { margin-right: 5px; }
        .pm-estado { display:inline-block; padding: 4px 14px; border-radius: 999px; font-weight: 700; font-size:.9rem; }
        .e-RECIBIDA, .e-REVISION { background:#eef4ff; color:#1d4ed8; }
        .e-PENDIENTE { background:#fff7e6; color:#b45309; }
        .e-APROBADA { background:#ecfdf3; color:#067647; }
        .e-RECHAZADA { background:#fef3f2; color:#b42318; }
    </style>
</head>
<body>
<header class="pm-cabeza">
    <div class="pm-cont d-flex align-items-center gap-3">
        <a href="/" class="d-flex align-items-center gap-3">
            {% if colegio.escudo %}<img src="{{ colegio.escudo.url }}" alt="">{% endif %}
            <strong style="font-size:1.05rem;">{{ colegio.nombre }}</strong>
        </a>
        <span class="ms-auto d-none d-sm-inline" style="opacity:.85;">Prematrícula</span>
    </div>
</header>
<main class="pm-cont my-4">
    {% if messages %}{% for m in messages %}
        <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>
    {% endfor %}{% endif %}
    {% block contenido %}{% endblock %}
    <p class="text-center text-muted mt-4" style="font-size:.82rem;"><a href="/" class="text-muted">Volver al portal del colegio</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
