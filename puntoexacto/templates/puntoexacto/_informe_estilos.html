<style>
  @page { size: letter{% if horizontal %} landscape{% endif %}; margin: 15mm 14mm 16mm;
          @bottom-left { content: "Informe desarrollado por medio de la plataforma mcolegio · mcolegio.com.co"; font: 7.5pt Helvetica; color: #64748b; }
