{% extends 'notas/base.html' %}
{% block extra_css %}
<style>
    .pe-barra { display:flex; flex-wrap:wrap; gap:10px; align-items:center;
                margin-bottom:22px; }
    .pe-barra .crece { margin-left:auto; }
    .pe-tarjeta { background:#fff; border:1px solid #e3e6ec; border-radius:10px;
                  padding:22px; box-shadow:0 2px 8px rgba(16,24,40,.05); margin-bottom:20px; }
    .pe-tarjeta h5 { font-weight:700; margin-bottom:14px; }
    .pe-tabla { width:100%; border-collapse:collapse; font-size:.93rem; }
    .pe-tabla th, .pe-tabla td { padding:9px 11px; border-bottom:1px solid #eceef2;
                                 text-align:left; vertical-align:middle; }
    .pe-tabla th { font-size:.76rem; text-transform:uppercase; letter-spacing:.05em;
                   color:#6b7280; font-weight:600; }
    .pe-tabla tbody tr:hover { background:#f8f9fb; }
    .pe-num { text-align:center; font-variant-numeric:tabular-nums; }
    .pe-chip { display:inline-block; font-size:.72rem; font-weight:600; padding:2px 9px;
               border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
    .pe-ok { color:#0b6b4a; } .pe-mal { color:#a4161a; } .pe-media { color:#8a6d00; }
    .pe-gris { color:#6b7280; }
    .pe-aviso { background:#fff8e6; border-left:3px solid #8a6d00; padding:12px 16px;
                border-radius:0 7px 7px 0; margin-bottom:16px; font-size:.92rem; }
    .pe-aviso ul { margin:6px 0 0; padding-left:18px; }
    .pe-vacio { text-align:center; color:#6b7280; padding:36px 10px; }
    .pe-opciones { display:flex; gap:6px; flex-wrap:wrap; }
    .pe-opciones label { cursor:pointer; }
    .pe-opciones input { margin-right:3px; }

    .pe-claves { display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; margin-bottom:14px;
                 border-bottom:2px solid #e3e6ec; }
    .pe-clave-tab { padding:8px 16px; border:1px solid #e3e6ec; border-bottom:none; border-radius:8px 8px 0 0;
                    background:#f6f7f9; color:#374151; font-weight:600; text-decoration:none; margin-bottom:-2px; }
    .pe-clave-tab.activa { background:#fff; color:#193661; border-color:#193661; border-bottom:2px solid #fff; }
    .pe-falta { display:inline-block; min-width:20px; padding:0 6px; border-radius:999px; background:#a4161a;
                color:#fff; font-size:.72rem; text-align:center; }
    .pe-clave-mas { margin-left:auto; font-size:.86rem; padding:8px 4px; }
</style>
{% endblock %}
