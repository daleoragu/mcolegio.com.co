{% load static %}<!DOCTYPE html>
<html lang="es"><head>
{% include "notas/includes/_head.html" %}
<style>
  :root { --mc-azul:#1f3a68; --mc-oro:#f2b33d; }
  body.vt { margin:0; padding:0 !important; background:#eef1f6; min-height:100dvh; }
  .vt .mc-instalar { display:none !important; }
  .vt-barra { background:var(--topbar-bg, var(--mc-azul)); color:var(--topbar-text, #fff); padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top)); display:flex; align-items:center; gap:12px; }
  .vt-barra img { height:42px; width:auto; background:#fff; border-radius:8px; padding:2px; }
  .vt-barra b { display:block; font-size:1.1rem; }
  .vt-barra small { opacity:.85; }
  .vt-barra a { color:inherit; }
  .vt-cuerpo { max-width:980px; margin:0 auto; padding:18px 16px 40px; }
  .vt-cargo { background:#fff; border-radius:18px; padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
  .vt-cargo h2 { font-size:1.15rem; font-weight:800; color:var(--mc-azul); margin:0 0 12px; }
  .vt-opciones { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px; }
  .vt-op { position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; border:3px solid #e3e7ef; border-radius:16px; padding:14px 10px; cursor:pointer; background:#fff; }
  .vt-op input { position:absolute; opacity:0; }
  .vt-op:has(input:checked) { border-color:var(--mc-oro); background:#fff8e8; box-shadow:0 0 0 3px rgba(242,179,61,.25); }
  .vt-op:has(input:focus-visible) { outline:3px solid var(--mc-azul); outline-offset:2px; }
  .vt-op:has(input:checked)::after { content:'✔'; position:absolute; top:8px; right:10px; background:var(--mc-oro); color:var(--mc-azul); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; }
  .vt-foto { width:110px; height:110px; border-radius:50%; object-fit:cover; background:#e4e9f2; display:flex; align-items:center; justify-content:center; font-size:2.4rem; font-weight:800; color:var(--mc-azul); }
  .vt-num { font-size:1.8rem; font-weight:900; color:var(--mc-azul); line-height:1; }
  .vt-nombre { font-weight:700; }
  .vt-prop { font-size:.8rem; color:#5d6779; }
  .vt-blanco .vt-foto { background:#fff; border:2px dashed #c5cfe0; font-size:1rem; color:#5d6779; }
  .vt-boton { display:block; width:100%; border:0; border-radius:16px; background:var(--mc-azul); color:#fff; font-size:1.2rem; font-weight:800; padding:16px; }
  .vt-boton.oro { background:var(--mc-oro); color:var(--mc-azul); }
  .vt-resumen { background:#fff; border-radius:18px; padding:18px; border:3px solid var(--mc-oro); }
</style>
</head>
<body class="vt">
  <header class="vt-barra">
    {% if colegio.escudo %}<img src="{{ colegio.escudo.url }}" alt="">{% endif %}
    <div class="flex-grow-1"><b>{{ e.nombre }}</b><small>{{ colegio.nombre }}</small></div>
    {% block barra %}{% endblock %}
  </header>
  <main class="vt-cuerpo">{% block content %}{% endblock %}</main>
  {% block extra_js %}{% endblock %}
</body></html>
