{# Estilos de la portada del inicio (sirve para todos los diseños, también los clásicos). #}
<style>
    .pd-portada { position: relative; min-height: clamp(380px, 64vh, 640px); overflow: hidden; color: #fff;
                  background: linear-gradient(135deg, var(--color-primario), var(--color-topbar-fondo)); }
    .pd-portada-fotos, .pd-portada-fotos .carousel-inner, .pd-portada-fotos .carousel-item { position: absolute; inset: 0; height: 100%; }
    .pd-portada-img { position: absolute; inset: 0; background: #111 center/cover no-repeat; }
    .pd-portada-sombra { position: absolute; inset: 0; z-index: 1; pointer-events: none;
                         background: radial-gradient(ellipse at center, rgba(0,0,0,.25) 0%, rgba(0,0,0,.6) 100%),
                                     linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.45)); }
    .pd-portada-capa { position: relative; z-index: 2; min-height: inherit; display: flex; align-items: center;
                       text-align: center; padding: 64px 0 72px; pointer-events: none; }
    .pd-portada-capa .container > * { pointer-events: auto; }
    .pd-portada-escudo { height: clamp(72px, 10vw, 112px); width: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,.35)); }
    .pd-portada-escudo.pd-escudo-vacio { display: inline-flex; align-items: center; justify-content: center; width: 96px;
                                         height: 96px; border-radius: 50%; background: rgba(255,255,255,.15); font-size: 2.6rem; }
    .pd-portada-nombre { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-weight: 800; color: #fff;
                         font-size: clamp(2rem, 5.6vw, 4.4rem); line-height: 1.06; margin: .5rem auto .35rem; max-width: 24ch;
                         text-wrap: balance; text-shadow: 0 3px 18px rgba(0,0,0,.45); }
    .pd-portada-lema { font-size: clamp(1rem, 1.8vw, 1.3rem); font-style: italic; opacity: .95; margin: 0 0 1.4rem;
                       text-shadow: 0 2px 10px rgba(0,0,0,.45); }
    .pd-portada-botones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .pd-portada-btn { display: inline-flex; align-items: center; gap: .45rem; padding: .7rem 1.4rem; border-radius: 999px;
                      font-weight: 700; color: #fff; text-decoration: none; border: 2px solid rgba(255,255,255,.85);
                      background: rgba(0,0,0,.18); backdrop-filter: blur(2px); transition: background .15s, transform .15s; }
    .pd-portada-btn:hover { background: rgba(255,255,255,.16); color: #fff; transform: translateY(-1px); }
    .pd-portada-btn-fuerte { background: #fff; color: var(--color-primario); border-color: #fff; }
    .pd-portada-btn-fuerte:hover { background: #fff; color: var(--color-primario); filter: brightness(.96); }
    .pd-portada-pie { position: absolute; right: 18px; bottom: 16px; z-index: 2; color: #fff; max-width: calc(50% - 90px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .82rem; padding: 4px 12px;
                      border-radius: 999px; background: rgba(0,0,0,.45); }
    .pd-portada .carousel-indicators { z-index: 3; margin-bottom: 1.1rem; }
    .pd-portada .carousel-control-prev, .pd-portada .carousel-control-next { z-index: 3; width: 8%; }
    .pd-portada-ayuda { position: absolute; left: 14px; top: 14px; z-index: 4; max-width: 340px; padding: 10px 13px;
                        border-radius: 12px; background: rgba(255,255,255,.96); color: #1f2937; font-size: .8rem; line-height: 1.4;
                        text-decoration: none; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
    .pd-portada-ayuda strong { display: block; font-size: .86rem; margin-bottom: 2px; color: #111827; }
    .pd-portada-ayuda-ir { display: block; margin-top: 4px; font-weight: 700; color: var(--color-primario); }
    .pd-portada-ayuda:hover { color: #1f2937; box-shadow: 0 8px 26px rgba(0,0,0,.25); }
    #defaultMainContent > .pd-portada:only-child, .portal-clasico-portada .pd-portada { border-radius: 14px; }
    /* Diseño «Portada»: el menú va encima de la foto. */
    .diseno-portada .pd-portada { min-height: 88vh; }
    .diseno-portada .pd-portada-capa { padding-top: 120px; }
    .diseno-portada .pd-portada-ayuda { top: 84px; }
    .diseno-portada .pd-portada-pie { bottom: 96px; }
    .diseno-portada .pd-portada .carousel-indicators { margin-bottom: 96px; }
    @media (max-width: 575.98px) {
        .pd-portada-ayuda { position: relative; left: auto; top: auto; display: block; max-width: none; margin: 10px; }
        .pd-portada-pie { display: none; }
    }
</style>
