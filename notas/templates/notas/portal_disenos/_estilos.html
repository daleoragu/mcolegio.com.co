{# Estilos de los diseños nuevos del portal. Todo sale de los colores del colegio (variables de base_portal). #}
{% if diseno == 'minimal' or diseno == 'revista' %}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
{% endif %}
<style>
    :root {
        --pd-p: var(--color-primario);
        --pd-p-texto: var(--color-texto-primario);
        --pd-s: var(--color-secundario);
        --pd-top: var(--color-topbar-fondo);
        --pd-top-texto: var(--color-topbar-texto);
        --pd-claro: color-mix(in srgb, var(--color-primario) 9%, #ffffff);
        --pd-borde: color-mix(in srgb, var(--color-primario) 18%, #e5e7eb);
        --pd-oscuro: color-mix(in srgb, var(--color-topbar-fondo) 82%, #000000);
        --pd-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    .pd-escudo { height: 64px; width: auto; max-width: 90px; object-fit: contain; }
    .pd-escudo-vacio { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px;
                       border-radius: 12px; background: var(--pd-claro); color: var(--pd-p); font-size: 1.6rem; }
    .pd-seccion { padding: 56px 0; }
    .pd-titulo { font-weight: 800; font-size: 1.55rem; margin-bottom: 22px; display: flex; align-items: center; gap: 12px; }
    .pd-titulo::before { content: ''; width: 6px; height: 1.3em; border-radius: 3px; background: var(--pd-p); }
    .pd-mas { font-weight: 600; color: var(--pd-p); text-decoration: none; }
    .pd-mas:hover { text-decoration: underline; color: var(--pd-p); }
    .pd-destacado { background: var(--pd-p); color: var(--pd-p-texto) !important; border-radius: 999px;
                    padding: .45rem 1.05rem !important; font-weight: 700; }
    .pd-tarjeta-seccion { border: 0; border-top: 4px solid var(--pd-p); border-radius: 14px; }
    .pd-btn { background: var(--pd-p); color: var(--pd-p-texto); border: 2px solid var(--pd-p); font-weight: 700;
              border-radius: 999px; padding: .7rem 1.5rem; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
    .pd-btn:hover { filter: brightness(1.08); color: var(--pd-p-texto); }
    .pd-btn-borde { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.85); font-weight: 700;
                    border-radius: 999px; padding: .7rem 1.5rem; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
    .pd-btn-borde:hover { background: rgba(255,255,255,.12); color: #fff; }

    /* Noticias */
    .pd-noticias { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 24px; }
    .pd-noticia { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(16,24,40,.07);
                  display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s; }
    .pd-noticia:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(16,24,40,.12); }
    .pd-noticia-img { display: flex; align-items: center; justify-content: center; height: 190px; background: var(--pd-claro) center/cover no-repeat;
                      color: var(--pd-p); font-size: 2.4rem; text-decoration: none; }
    .pd-noticia-cuerpo { padding: 16px 18px 20px; }
    .pd-noticia time { font-size: .8rem; color: var(--pd-s); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .pd-noticia h3 { font-size: 1.08rem; font-weight: 700; margin: 6px 0 8px; line-height: 1.35; }
    .pd-noticia h3 a { color: inherit; text-decoration: none; }
    .pd-noticia h3 a:hover { color: var(--pd-p); }
    .pd-noticia p { color: #4b5563; font-size: .93rem; margin: 0; }
    .pd-vacio { background: #fff; border: 1px dashed var(--pd-borde); border-radius: 14px; padding: 28px; text-align: center; color: #6b7280; }

    /* Accesos rápidos */
    .pd-accesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
    .pd-acceso { background: #fff; border-radius: 14px; padding: 18px 12px; text-align: center; text-decoration: none; color: #1f2937;
                 box-shadow: 0 2px 12px rgba(16,24,40,.08); display: flex; flex-direction: column; align-items: center; gap: 10px;
                 font-weight: 600; font-size: .95rem; transition: transform .2s; }
    .pd-acceso:hover { transform: translateY(-3px); color: var(--pd-p); }
    .pd-acceso i { width: 52px; height: 52px; border-radius: 50%; background: var(--pd-claro); color: var(--pd-p);
                   display: inline-flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    .pd-acceso-fuerte { background: var(--pd-p); color: var(--pd-p-texto); }
    .pd-acceso-fuerte:hover { color: var(--pd-p-texto); }
    .pd-acceso-fuerte i { background: rgba(255,255,255,.18); color: var(--pd-p-texto); }

    /* Galería y sedes */
    .pd-galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .pd-galeria a { aspect-ratio: 1 / 1; border-radius: 12px; background: #e5e7eb center/cover no-repeat; display: block; }
    .pd-sedes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .pd-sede { background: #fff; border-radius: 14px; padding: 16px 18px; border-left: 5px solid var(--pd-p);
               box-shadow: 0 2px 12px rgba(16,24,40,.06); text-decoration: none; color: inherit; display: block; }
    .pd-sede strong { display: block; margin-bottom: 4px; }
    .pd-sede span { color: #6b7280; font-size: .88rem; }

    /* Carrusel */
    .pd-carrusel { position: relative; }
    .pd-carrusel-img { height: 62vh; min-height: 320px; max-height: 620px; background: #111 center/cover no-repeat; }
    .pd-carrusel-texto { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 8% 46px; color: #fff;
                         background: linear-gradient(transparent, rgba(0,0,0,.65)); }
    .pd-carrusel-texto h2 { font-weight: 800; font-size: clamp(1.4rem, 3vw, 2.4rem); margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
    .pd-carrusel-texto p { margin: 6px 0 0; font-size: 1.05rem; opacity: .95; }

    /* Pie */
    .pd-pie { background: var(--color-footer-fondo); color: var(--color-footer-texto); }
    .pd-pie h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; opacity: .7; margin-bottom: 14px; font-weight: 700; }
    .pd-pie a { color: inherit; text-decoration: none; }
    .pd-pie a:hover { text-decoration: underline; }
    .pd-pie-lista li { margin-bottom: 8px; display: flex; gap: 10px; }
    .pd-pie-lista i { width: 16px; margin-top: 4px; opacity: .7; }
    .pd-pie-escudo { height: 58px; width: auto; background: #fff; border-radius: 10px; padding: 4px; }
    .pd-pie-redes { display: flex; gap: 10px; margin-top: 12px; }
    .pd-pie-redes a { width: 38px; height: 38px; border-radius: 50%; border: 1px solid currentColor; display: inline-flex;
                      align-items: center; justify-content: center; opacity: .85; }
    .pd-pie-final { border-top: 1px solid color-mix(in srgb, var(--color-footer-texto) 15%, transparent);
                    padding: 14px 0; font-size: .85rem; opacity: .75; }

    .pd-nav .nav-link { font-weight: 600; }
    .pd-nav .dropdown-menu { border: 0; box-shadow: 0 10px 30px rgba(16,24,40,.15); border-radius: 12px; padding: 8px; }
    .pd-nav .dropdown-item { border-radius: 8px; }
    .pd-nav .dropdown-item:hover { background: var(--pd-claro); color: var(--pd-p); }
    .pd-nav .navbar-toggler { border: 0; color: inherit; font-weight: 700; }
    .pd-nav .navbar-brand { min-width: 0; white-space: normal; }
    .pd-nav .navbar-brand span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
    @media (max-width: 991px) { .pd-nav .navbar-brand { flex: 1 1 0; max-width: calc(100% - 70px); margin-right: .5rem; font-size: 1rem; }
                                .pd-nav .navbar-toggler { flex: 0 0 auto; } }
    /* Botones flotantes de redes: más pequeños en el celular para no tapar el contenido. */
    @media (max-width: 575px) { .floating-action-buttons { right: 12px; bottom: 14px; gap: 8px; }
        .floating-action-buttons a { width: 40px; height: 40px; font-size: 18px; } }
    .pd-vista-previa { background: #111827; color: #fff; padding: 8px 0; font-size: .92rem; position: relative; z-index: 1100; }

    /* ============ 1. INSTITUCIONAL (franja) ============ */
    .diseno-franja .pd-franja-top { background: var(--pd-oscuro); color: var(--pd-top-texto); font-size: .85rem; padding: 7px 0; }
    .diseno-franja .pd-franja-top a { color: inherit; text-decoration: none; margin-left: 12px; opacity: .9; }
    .diseno-franja .pd-franja-top span { margin-right: 18px; opacity: .9; }
    .diseno-franja .pd-franja-cabeza { background: #fff; padding: 20px 0 16px; text-align: center; }
    .diseno-franja .pd-franja-cabeza .pd-escudo { height: 88px; max-width: 110px; }
    .diseno-franja .pd-franja-cabeza h1 { font-size: clamp(1.25rem, 2.6vw, 1.9rem); font-weight: 800; color: var(--pd-top); margin: 10px 0 2px; }
    .diseno-franja .pd-franja-cabeza em { color: var(--pd-s); }
    .diseno-franja .pd-franja-nav { background: var(--pd-top); }
    .diseno-franja .pd-franja-nav .nav-link, .diseno-franja .pd-franja-nav .navbar-toggler { color: var(--pd-top-texto); padding: 14px 16px !important; }
    .diseno-franja .pd-franja-nav .nav-link:hover { background: rgba(255,255,255,.1); }
    .diseno-franja .pd-banner { background: linear-gradient(120deg, var(--pd-p), var(--pd-top)); color: var(--pd-p-texto);
                                padding: 80px 0 110px; text-align: center; }
    .diseno-franja .pd-banner h2 { font-size: clamp(1.6rem, 4vw, 2.8rem); font-weight: 800; }
    .diseno-franja .pd-accesos-flotan { margin-top: -54px; position: relative; z-index: 5; }
    .diseno-franja .pd-mision { background: var(--pd-p); color: var(--pd-p-texto); padding: 56px 0; }
    .diseno-franja .pd-mision p { font-size: 1.12rem; line-height: 1.7; max-width: 860px; margin: 0 auto 18px; }

    /* ============ 2. PORTADA ============ */
    .diseno-portada .pd-portada-nav { background: var(--pd-top); color: var(--pd-top-texto); z-index: 20; width: 100%; }
    .diseno-portada.pd-en-inicio .pd-portada-nav { position: absolute; top: 0; left: 0; background: transparent; color: #fff; }
    .diseno-portada .pd-portada-nav .nav-link, .diseno-portada .pd-portada-nav .navbar-brand { color: inherit; }
    .diseno-portada .pd-portada-nav .navbar-brand .pd-escudo { height: 46px; }
    .diseno-portada .pd-heroe { min-height: 88vh; display: flex; align-items: center; color: #fff; text-align: center; position: relative;
                               background: var(--pd-top) center/cover no-repeat; }
    .diseno-portada .pd-heroe::before { content: ''; position: absolute; inset: 0;
        background: linear-gradient(135deg, color-mix(in srgb, var(--pd-p) 82%, transparent), color-mix(in srgb, var(--pd-top) 72%, transparent)); }
    .diseno-portada .pd-heroe > .container { position: relative; padding-top: 90px; padding-bottom: 60px; }
    .diseno-portada .pd-heroe .pd-escudo { height: 120px; max-width: 140px; background: rgba(255,255,255,.95); border-radius: 22px; padding: 10px; }
    .diseno-portada .pd-heroe h1 { font-size: clamp(2rem, 5.5vw, 3.6rem); font-weight: 800; margin: 22px 0 10px; text-shadow: 0 3px 18px rgba(0,0,0,.25); }
    .diseno-portada .pd-heroe .pd-lema { font-size: clamp(1.05rem, 2.2vw, 1.35rem); opacity: .95; font-style: italic; }
    .diseno-portada .pd-pilares { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; margin-top: -70px; position: relative; z-index: 3; }
    .diseno-portada .pd-pilar { background: #fff; border-radius: 16px; padding: 26px; box-shadow: 0 14px 34px rgba(16,24,40,.12); }
    .diseno-portada .pd-pilar i { font-size: 1.6rem; color: var(--pd-p); }
    .diseno-portada .pd-pilar h3 { font-size: 1.15rem; font-weight: 800; margin: 12px 0 8px; }
    .diseno-portada .pd-pilar p { color: #4b5563; font-size: .95rem; margin: 0; }

    /* ============ 3. MOSAICO ============ */
    .diseno-mosaico .pd-mosaico-nav { background: var(--pd-top); color: var(--pd-top-texto); }
    .diseno-mosaico .pd-mosaico-nav .nav-link, .diseno-mosaico .pd-mosaico-nav .navbar-brand { color: inherit; }
    .diseno-mosaico .pd-mosaico-nav .pd-escudo { height: 44px; }
    .diseno-mosaico .pd-bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 170px; gap: 16px; }
    .diseno-mosaico .pd-celda { border-radius: 20px; padding: 22px; overflow: hidden; position: relative; text-decoration: none;
                                display: flex; flex-direction: column; justify-content: flex-end; color: #1f2937; background: #fff;
                                box-shadow: 0 2px 12px rgba(16,24,40,.07); transition: transform .2s; }
    .diseno-mosaico a.pd-celda:hover { transform: scale(1.015); }
    .diseno-mosaico .pd-celda h3 { font-weight: 800; font-size: 1.15rem; margin: 0; }
    .diseno-mosaico .pd-celda small { opacity: .8; }
    .diseno-mosaico .pd-celda .pd-icono { position: absolute; top: 18px; right: 20px; font-size: 1.6rem; opacity: .85; }
    .diseno-mosaico .pd-celda .pd-cifra { font-size: 2.6rem; font-weight: 800; line-height: 1; }
    .diseno-mosaico .c-2x2 { grid-column: span 2; grid-row: span 2; }
    .diseno-mosaico .c-2x1 { grid-column: span 2; }
    .diseno-mosaico .c-p { background: var(--pd-p); color: var(--pd-p-texto); }
    .diseno-mosaico .c-s { background: var(--pd-s); color: #fff; }
    .diseno-mosaico .c-t { background: var(--pd-top); color: var(--pd-top-texto); }
    .diseno-mosaico .c-claro { background: var(--pd-claro); color: #1f2937; }
    .diseno-mosaico .c-foto { background: #333 center/cover no-repeat; color: #fff; }
    .diseno-mosaico .c-foto::before { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(0,0,0,.7)); }
    .diseno-mosaico .c-foto > * { position: relative; }
    .diseno-mosaico .pd-mini-galeria { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; position: absolute; inset: 0; }
    .diseno-mosaico .pd-mini-galeria span { background: #ddd center/cover no-repeat; }
    .diseno-mosaico .pd-galeria-texto { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 22px 18px;
                                        background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff; }
    @media (max-width: 991px) { .diseno-mosaico .pd-bento { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 575px) { .diseno-mosaico .pd-bento { grid-template-columns: 1fr; grid-auto-rows: 150px; }
        .diseno-mosaico .c-2x2, .diseno-mosaico .c-2x1 { grid-column: span 1; } .diseno-mosaico .c-2x2 { grid-row: span 2; } }

    /* ============ 4. MINIMALISTA ============ */
    .diseno-minimal { background: var(--color-fondo); }
    .diseno-minimal .pd-minimal-nav { background: #fff; border-bottom: 1px solid #e5e7eb; }
    .diseno-minimal .pd-minimal-nav .navbar-brand { font-family: var(--pd-serif); font-weight: 700; color: #111827; }
    .diseno-minimal .pd-minimal-nav .pd-escudo { height: 40px; }
    .diseno-minimal .pd-minimal-nav .nav-link { color: #374151; border-bottom: 2px solid transparent; border-radius: 0; margin: 0 6px; padding: 18px 2px !important; }
    .diseno-minimal .pd-minimal-nav .nav-link:hover { border-bottom-color: var(--pd-p); color: #111827; }
    .diseno-minimal .pd-minimal-nav .pd-destacado { margin-left: 8px; padding: .45rem 1rem !important; border-bottom: 0; align-self: center; }
    .diseno-minimal .pd-intro { padding: 90px 0 60px; }
    .diseno-minimal .pd-intro small { color: var(--pd-p); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .diseno-minimal .pd-intro h1 { font-family: var(--pd-serif); font-size: clamp(2.1rem, 5vw, 3.7rem); font-weight: 700; line-height: 1.12; margin: 14px 0 22px; max-width: 900px; }
    .diseno-minimal .pd-intro p { font-size: 1.15rem; color: #4b5563; max-width: 720px; line-height: 1.7; }
    .diseno-minimal .pd-lista-noticias article { display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid #e5e7eb; }
    .diseno-minimal .pd-lista-noticias time { color: var(--pd-p); font-weight: 700; font-size: .9rem; }
    .diseno-minimal .pd-lista-noticias h3 { font-family: var(--pd-serif); font-size: 1.4rem; margin: 0 0 6px; }
    .diseno-minimal .pd-lista-noticias h3 a { color: #111827; text-decoration: none; }
    .diseno-minimal .pd-lista-noticias h3 a:hover { color: var(--pd-p); }
    .diseno-minimal .pd-lista-noticias p { color: #4b5563; margin: 0; }
    .diseno-minimal .pd-titulo { font-family: var(--pd-serif); font-weight: 700; }
    .diseno-minimal .pd-titulo::before { display: none; }
    .diseno-minimal .pd-enlaces-min a { display: inline-flex; gap: 8px; align-items: center; color: #111827; text-decoration: none; font-weight: 600;
                                        border: 1px solid #d1d5db; border-radius: 999px; padding: 8px 16px; margin: 0 8px 8px 0; background: #fff; }
    .diseno-minimal .pd-enlaces-min a:hover { border-color: var(--pd-p); color: var(--pd-p); }
    @media (max-width: 575px) { .diseno-minimal .pd-lista-noticias article { grid-template-columns: 1fr; gap: 4px; } }

    /* ============ 5. REVISTA ============ */
    .diseno-revista { background: #fbfaf7; }
    .diseno-revista .pd-cabecera { background: #fff; padding: 14px 0 0; }
    .diseno-revista .pd-fecha { font-size: .82rem; color: #6b7280; }
    .diseno-revista .pd-fecha > span:first-child::first-letter { text-transform: uppercase; }
    .diseno-revista .pd-cabecera-nombre { text-align: center; padding: 12px 0 14px; border-bottom: 4px double var(--pd-p); }
    .diseno-revista .pd-cabecera-nombre h1 { font-family: var(--pd-serif); font-weight: 800; font-size: clamp(1.8rem, 5vw, 3.4rem); margin: 0; color: #111827; letter-spacing: -.01em; }
    .diseno-revista .pd-cabecera-nombre em { color: var(--pd-s); }
    .diseno-revista .pd-revista-nav { background: #fff; border-bottom: 1px solid #e5e7eb; }
    .diseno-revista .pd-revista-nav .nav-link { color: #111827; text-transform: uppercase; font-size: .82rem; letter-spacing: .1em; padding: 12px 14px !important; }
    .diseno-revista .pd-revista-nav .nav-link:hover { color: var(--pd-p); }
    .diseno-revista .pd-cinta { background: var(--pd-p); color: var(--pd-p-texto); font-size: .9rem; overflow: hidden; white-space: nowrap; }
    .diseno-revista .pd-cinta strong { background: var(--pd-top); color: var(--pd-top-texto); padding: 8px 14px; display: inline-block; position: relative; z-index: 2; }
    .diseno-revista .pd-cinta-corre { display: inline-block; padding-left: 100%; animation: pd-correr 28s linear infinite; }
    .diseno-revista .pd-cinta-corre a { color: inherit; text-decoration: none; margin-right: 48px; }
    @keyframes pd-correr { to { transform: translateX(-100%); } }
    @media (prefers-reduced-motion: reduce) { .diseno-revista .pd-cinta-corre { animation: none; padding-left: 12px; } }
    .diseno-revista .pd-principal-img { display: block; aspect-ratio: 16 / 9; background: var(--pd-claro) center/cover no-repeat; border-radius: 4px; }
    .diseno-revista .pd-antetitulo { color: var(--pd-p); font-weight: 800; font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; }
    .diseno-revista .pd-principal h2 { font-family: var(--pd-serif); font-size: clamp(1.6rem, 3.2vw, 2.4rem); font-weight: 800; line-height: 1.15; margin: 8px 0 12px; }
    .diseno-revista .pd-principal h2 a, .diseno-revista .pd-lateral h3 a { color: #111827; text-decoration: none; }
    .diseno-revista .pd-principal h2 a:hover, .diseno-revista .pd-lateral h3 a:hover { color: var(--pd-p); }
    .diseno-revista .pd-principal p { font-size: 1.08rem; color: #374151; }
    .diseno-revista .pd-lateral article { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid #e5e7eb; }
    .diseno-revista .pd-lateral .pd-mini { aspect-ratio: 1 / 1; background: var(--pd-claro) center/cover no-repeat; border-radius: 4px; display: block; }
    .diseno-revista .pd-lateral h3 { font-family: var(--pd-serif); font-size: 1.05rem; margin: 2px 0 0; line-height: 1.3; }
    .diseno-revista .pd-lateral time { font-size: .76rem; color: #6b7280; }
    .diseno-revista .pd-caja { background: #fff; border-top: 4px solid var(--pd-p); padding: 18px; margin-bottom: 18px; }
    .diseno-revista .pd-caja h4 { font-family: var(--pd-serif); font-weight: 800; font-size: 1.15rem; }
    .diseno-revista .pd-titulo { font-family: var(--pd-serif); border-bottom: 1px solid #111827; padding-bottom: 8px; }
    .diseno-revista .pd-titulo::before { display: none; }
    .diseno-revista .pd-noticia { border-radius: 4px; box-shadow: none; border: 1px solid #ece9e2; }
    .diseno-revista .pd-noticia h3 { font-family: var(--pd-serif); }
