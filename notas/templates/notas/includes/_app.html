{# App instalable: manifiesto, color de la barra y botón «Instalar app». Va dentro del <head>. #}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="{{ colegio.color_topbar|default:'#1f2937' }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{% if colegio.nombre_app %}{{ colegio.nombre_app }}{% else %}{{ colegio.nombre|default:'mcolegio'|truncatechars:20 }}{% endif %}">
<link rel="apple-touch-icon" href="/app/icono-192.png">
<style>
  .mc-instalar { position:fixed; left:16px; bottom:16px; z-index:1040; display:none; align-items:center; gap:8px;
                 background:#fff; color:#111827; border-radius:999px; box-shadow:0 6px 22px rgba(0,0,0,.18);
                 padding:6px 6px 6px 14px; max-width:calc(100vw - 104px); font:600 .88rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .mc-instalar button { border:0; border-radius:999px; padding:8px 14px; font-weight:700; cursor:pointer; }
  .mc-instalar .mc-si { background:{{ colegio.color_topbar|default:'#1f2937' }}; color:#fff; }
  .mc-instalar .mc-no { background:transparent; color:#6b7280; padding:8px 10px; }
  .mc-ios { position:fixed; inset:0; z-index:1060; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; }
  .mc-ios > div { background:#fff; border-radius:18px 18px 0 0; padding:22px 20px 28px; max-width:480px; width:100%;
                  font:400 1rem/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#111827; }
  .mc-ios b { font-weight:700; }
  @media print { .mc-instalar, .mc-ios { display:none !important; } }
</style>
<script>
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
  }
  var instalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (instalada) return;
  var LLAVE = 'mc-instalar-oculto';
  function oculto() { try { return Number(localStorage.getItem(LLAVE) || 0) > Date.now(); } catch (e) { return false; } }
  function ocultar() { try { localStorage.setItem(LLAVE, String(Date.now() + 30 * 864e5)); } catch (e) {} }
  var esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var esCelular = esIOS || /android|mobile/i.test(navigator.userAgent);
  var pedido = null;

  function boton() {
    if (oculto() || document.getElementById('mc-instalar')) return;
    var b = document.createElement('div');
    b.id = 'mc-instalar';
    b.className = 'mc-instalar';
    b.innerHTML = '<span>📲 App del colegio</span><button type="button" class="mc-si">Instalar</button>' +
                  '<button type="button" class="mc-no" aria-label="Ahora no">✕</button>';
    document.body.appendChild(b);
    b.style.display = 'flex';
    b.querySelector('.mc-no').onclick = function () { ocultar(); b.remove(); };
    b.querySelector('.mc-si').onclick = function () {
      if (pedido) {
        pedido.prompt();
        pedido.userChoice.then(function () { pedido = null; b.remove(); });
      } else {
        instrucciones();
      }
    };
  }

  function instrucciones() {
    var ua = navigator.userAgent;
    var dentroDeApp = /FBAN|FBAV|Instagram|Line\/|; wv\)|TikTok/i.test(ua);
    var pasos;
    if (dentroDeApp) {
      pasos = '<p style="margin:0 0 6px">Abrió el enlace dentro de otra aplicación (Facebook, Instagram…), y desde ahí no se puede instalar.</p>' +
              '<p style="margin:0 0 16px">Toque los <b>tres puntos</b> y escoja <b>«Abrir en el navegador»</b> (Chrome o Safari). Allí toque de nuevo <b>Instalar</b>.</p>';
    } else if (esIOS) {
      pasos = '<p style="margin:0 0 6px">1. Ábrala en <b>Safari</b>. Toque el botón <b>Compartir</b> (el cuadro con la flecha ⬆️).</p>' +
              '<p style="margin:0 0 6px">2. Baje y toque <b>«Agregar a inicio»</b>.</p>' +
              '<p style="margin:0 0 16px">3. Toque <b>Agregar</b>. El icono del colegio queda en su pantalla.</p>';
    } else if (/SamsungBrowser/i.test(ua)) {
      pasos = '<p style="margin:0 0 6px">1. Toque el menú <b>☰</b> (abajo a la derecha).</p>' +
              '<p style="margin:0 0 16px">2. Toque <b>«Añadir página a»</b> → <b>«Pantalla de inicio»</b>.</p>';
    } else {
      pasos = '<p style="margin:0 0 6px">1. En Chrome, toque los <b>tres puntos ⋮</b> (arriba a la derecha).</p>' +
              '<p style="margin:0 0 16px">2. Toque <b>«Instalar app»</b> o <b>«Agregar a la pantalla principal»</b>.</p>';
    }
    var m = document.createElement('div');
    m.className = 'mc-ios';
    m.innerHTML = '<div><p style="margin:0 0 10px"><b>Para instalar la app del colegio:</b></p>' + pasos +
      '<button type="button" style="width:100%;border:0;border-radius:12px;padding:12px;font-weight:700">Entendido</button></div>';
    document.body.appendChild(m);
    m.style.display = 'flex';
    m.onclick = function (e) { if (e.target === m || e.target.tagName === 'BUTTON') m.remove(); };
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    pedido = e;
    if (document.body) boton(); else document.addEventListener('DOMContentLoaded', boton);
  });
  window.addEventListener('appinstalled', function () { var b = document.getElementById('mc-instalar'); if (b) b.remove(); });
  // En el celular el botón sale siempre: si el navegador no ofrece la instalación
  // directa (Chrome a veces tarda, Samsung Internet, iPhone), muestra los pasos.
  if (esCelular) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boton); else boton();
  }
  window.mcInstalarApp = function () { if (pedido) { pedido.prompt(); } else { instrucciones(); } };
})();
</script>
{% if user.is_authenticated %}
{# Notificaciones al celular: banner «Activar avisos» y registro del celular. Gratis (Web Push). #}
<style>
  .mc-avisos { position:fixed; left:16px; bottom:16px; z-index:1041; display:flex; align-items:center; gap:8px;
               background:#fff; color:#111827; border-radius:16px; box-shadow:0 6px 22px rgba(0,0,0,.18);
               padding:8px 8px 8px 14px; max-width:calc(100vw - 32px); font:600 .88rem/1.25 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .mc-avisos button { border:0; border-radius:999px; padding:8px 14px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .mc-avisos .mc-si { background:{{ colegio.color_topbar|default:'#1f2937' }}; color:#fff; }
  .mc-avisos .mc-no { background:transparent; color:#6b7280; padding:8px 10px; }
  @media print { .mc-avisos { display:none !important; } }
</style>
<script>
(function () {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
  var esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var instalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (esIOS && !instalada) return;                 // en iPhone solo funciona con la app agregada a inicio
  var CSRF = '{{ csrf_token }}', LLAVE_NO = 'mc-avisos-oculto', LLAVE_OK = 'mc-avisos-sincronizado';
  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function post(url, datos) {
    return fetch(url, { method: 'POST', credentials: 'same-origin', body: JSON.stringify(datos || {}),
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF } });
  }
  function bytes(b64) {
    var s = (b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
    var crudo = atob(s), out = new Uint8Array(crudo.length);
    for (var i = 0; i < crudo.length; i++) out[i] = crudo.charCodeAt(i);
    return out;
  }
  function suscribir() {
    return navigator.serviceWorker.register('/sw.js').then(function () { return navigator.serviceWorker.ready; })
      .then(function (reg) {
        return fetch('/app/push/clave/', { credentials: 'same-origin' }).then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.clave) throw new Error('sin llave');
            return reg.pushManager.getSubscription().then(function (s) {
              return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes(d.clave) });
            });
          });
      })
      .then(function (s) { return post('/app/push/suscribir/', s.toJSON()); })
      .then(function () { guardar(LLAVE_OK, '{{ user.id }}:' + new Date().toDateString()); });
  }
  function activar(conPrueba) {
    return Notification.requestPermission().then(function (permiso) {
      if (permiso !== 'granted') return false;
      return suscribir().then(function () { if (conPrueba) post('/app/push/probar/'); return true; });
    });
  }
  window.mcActivarAvisos = function () { return activar(true); };

  if (Notification.permission === 'granted') {
    // Ya dio permiso: se vuelve a registrar el celular una vez al día (por si cambió de usuario o la llave).
    if (leer(LLAVE_OK) !== '{{ user.id }}:' + new Date().toDateString()) suscribir().catch(function () {});
    return;
  }
  if (Notification.permission === 'denied' || Number(leer(LLAVE_NO) || 0) > Date.now()) return;

  function banner() {
    if (document.getElementById('mc-avisos')) return;
    var b = document.createElement('div');
    b.id = 'mc-avisos';
    b.className = 'mc-avisos';
    b.innerHTML = '<span>🔔 Reciba en este celular los avisos del colegio</span>' +
                  '<button type="button" class="mc-si">Activar</button>' +
                  '<button type="button" class="mc-no" aria-label="Ahora no">✕</button>';
    if (document.getElementById('mc-instalar')) b.style.bottom = '72px';
    document.body.appendChild(b);
    b.querySelector('.mc-no').onclick = function () { guardar(LLAVE_NO, String(Date.now() + 15 * 864e5)); b.remove(); };
    b.querySelector('.mc-si').onclick = function () {
      activar(true).then(function (ok) {
        b.querySelector('span').textContent = ok ? '✅ Listo: le llegarán los avisos.' : 'No se activaron. Puede hacerlo después desde la configuración del navegador.';
        b.querySelector('.mc-si').remove();
        setTimeout(function () { b.remove(); }, 4000);
      }).catch(function () { b.remove(); });
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(banner, 800); });
  else setTimeout(banner, 800);
})();
</script>
{% endif %}
