{% load static %}{% if mostrar %}
{{ datos|json_script:"asesoria-datos" }}
<link rel="stylesheet" href="{% static 'css/asesoria.css' %}">
<button type="button" class="as-boton" id="as-boton" aria-haspopup="dialog" aria-controls="as-panel" title="Asesoría docente: le explico esta página">
  <i class="fas fa-chalkboard-user" aria-hidden="true"></i><span>Asesoría docente</span>
</button>
<div class="as-panel" id="as-panel" role="dialog" aria-modal="false" aria-labelledby="as-titulo" hidden>
  <div class="as-cab">
    <div><small>Asesoría docente</small><b id="as-titulo"></b></div>
    <button type="button" class="as-x" id="as-cerrar" aria-label="Cerrar">&times;</button>
  </div>
  <p class="as-resumen" id="as-resumen"></p>
  <button type="button" class="as-op as-principal" id="as-recorrido"><i class="fas fa-route"></i><span><b>Recorrido por esta página</b><small id="as-npasos"></small></span></button>
  <button type="button" class="as-op" id="as-quees"><i class="fas fa-hand-pointer"></i><span><b>¿Qué es esto?</b><small>Toque cualquier botón o sección y le explico qué hace.</small></span></button>
  <details class="as-mapa"><summary><i class="fas fa-map me-1"></i>Mapa de mcolegio: dónde está cada cosa</summary><ol id="as-mapa"></ol></details>
</div>
<script src="{% static 'js/asesoria.js' %}" defer></script>
{% endif %}
