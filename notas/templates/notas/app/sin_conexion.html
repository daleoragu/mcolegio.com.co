<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · {{ colegio.nombre|default:"mcolegio" }}</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f3f4f6;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#1f2937; }
  .caja { background:#fff; border-radius:18px; padding:32px 26px; max-width:360px; margin:16px; text-align:center;
          box-shadow:0 10px 30px rgba(0,0,0,.08); }
  img { width:84px; height:84px; border-radius:18px; }
  h1 { font-size:1.25rem; margin:16px 0 8px; }
  p { color:#6b7280; line-height:1.5; margin:0 0 20px; }
  button { background:{{ colegio.color_topbar|default:"#1f2937" }}; color:#fff; border:0; border-radius:999px;
           padding:12px 26px; font-size:1rem; font-weight:600; }
</style></head>
<body><div class="caja">
  <img src="/app/icono-192.png" alt="">
  <h1>No hay conexión a internet</h1>
  <p>Revise los datos o el wifi. Cuando vuelva la conexión, toque el botón para seguir donde estaba.</p>
  <button onclick="location.reload()">Intentar de nuevo</button>
</div></body></html>
