<style>
    .pv-marco { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; }
    .pv-marco iframe, .pv-play { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .pv-play { background: #000 center/cover no-repeat; cursor: pointer; padding: 0; }
    .pv-play::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.18); transition: background .15s; }
    .pv-play:hover::after { background: rgba(0,0,0,.05); }
    .pv-boton { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1; width: 72px; height: 50px;
                border-radius: 14px; background: #e1251b; color: #fff; display: flex; align-items: center; justify-content: center;
                font-size: 1.4rem; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
    .pv-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 26px; }
    .pv-lista h3 { font-size: 1.12rem; font-weight: 700; margin: 12px 0 4px; }
    .pv-lista p { color: #4b5563; font-size: .95rem; margin: 0; }
    .pv-lista time { font-size: .8rem; color: #6b7280; }
</style>
<style>

    .portal-clasico-videos .container { padding: 0; max-width: none; }
    .portal-clasico-videos .pd-titulo { font-weight: 800; font-size: 1.45rem; }
