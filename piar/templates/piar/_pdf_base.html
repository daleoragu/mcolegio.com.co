<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>{% block titulo %}{% endblock %}</title>
<style>
    @page { size: letter {% block orientacion %}portrait{% endblock %}; margin: 1.4cm 1.6cm;
            @bottom-right { content: "Página " counter(page) " de " counter(pages); font-size: 8px; color: #666; } }
    body { font-family: Helvetica, Arial, sans-serif; font-size: 10px; color: #222; line-height: 1.4; }
    .encabezado-con-bordes, .encabezado-sin-bordes { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
    .encabezado-con-bordes td, .encabezado-sin-bordes td { vertical-align: middle; padding: 0 4px; border: none; }
    .escudo { max-width: 85px; max-height: 75px; height: auto; width: auto; }
    h1 { text-align: center; font-size: 14px; letter-spacing: .5px; margin: 10px 0 2px; }
    .sub { text-align: center; font-size: 9px; color: #555; margin-bottom: 10px; }
    h2 { font-size: 11px; background: #ede9fe; color: #4c1d95; padding: 4px 8px; margin: 14px 0 6px; text-transform: uppercase; }
    h3 { font-size: 10.5px; margin: 10px 0 4px; break-after: avoid; page-break-after: avoid; }
    h2 { break-after: avoid; page-break-after: avoid; }
    table.t { width: 100%; border-collapse: collapse; margin: 4px 0 8px; page-break-inside: auto; }
    table.t th { background: #f3f4f6; font-size: 8.5px; text-transform: uppercase; text-align: left; }
    table.t th, table.t td { border: 1px solid #c3c8d0; padding: 4px 6px; vertical-align: top; }
    table.t tr { page-break-inside: avoid; }
    .pre { white-space: pre-line; }
    .vacio { color: #999; }
    .firmas { width: 100%; margin-top: 50px; border-collapse: collapse; }
    .firmas td { width: 50%; text-align: center; padding: 34px 14px 0; vertical-align: top; font-size: 9.5px; }
    .linea { border-top: 1px solid #222; margin: 0 auto 3px; width: 85%; }
</style></head>
<body>
{% include "notas/fragmentos/encabezado_pdf.html" %}
{% block cuerpo %}{% endblock %}
</body></html>
