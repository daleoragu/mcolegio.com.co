{% comment %}Selector de color de los documentos: muestras + color libre. Espera: id (prefijo), colores [(hex, nombre)].{% endcomment %}
<div class="mm-colores" id="{{ id }}" role="radiogroup" aria-label="Color del documento">
  {% for hex, nombre in colores %}<button type="button" class="mm-color" data-color="{{ hex }}" style="--c:{{ hex }}" title="{{ nombre }}" aria-label="{{ nombre }}"></button>{% endfor %}
  <label class="mm-color libre" title="Otro color"><input type="color" aria-label="Otro color"><i class="fas fa-palette"></i></label>
</div>
<style>
.mm-colores{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.mm-color{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 1px #cbd5e1;cursor:pointer;padding:0;position:relative;display:grid;place-items:center}
.mm-color.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c,#0f172a)}
.mm-color.libre{background:conic-gradient(#ef4444,#f59e0b,#22c55e,#06b6d4,#6366f1,#ec4899,#ef4444);color:#fff;font-size:.75rem;overflow:hidden}
.mm-color.libre input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
</style>
