<style>
  .mm { --mm-azul:#1f3a68; --mm-oro:#f2b632; --mm-linea:#e3e7ef; --mm-tenue:#5b6474; }
  .mm-tarjeta { background:#fff; border:1px solid var(--mm-linea); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .mm-tarjeta h6 { color:var(--mm-azul); font-weight:800; }
  .mm-oro { background:var(--mm-oro); color:#1d2433; font-weight:700; border:none; }
  .mm-oro:hover { background:#e0a520; color:#1d2433; }
  .mm-tipos { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .mm-tipos form { margin:0; }
  .mm-tipo { width:100%; border:1px solid var(--mm-linea); background:#f8fafd; border-radius:12px; padding:14px 10px;
             display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:600; color:var(--mm-azul); }
  .mm-tipo i { font-size:1.4rem; }
  .mm-tipo:hover { border-color:var(--mm-azul); background:#eef3fb; }
  .mm-barra { height:10px; background:#eef1f5; border-radius:999px; overflow:hidden; }
  .mm-barra > div { height:100%; background:var(--mm-azul); }
  .mm-barra.lleno > div { background:#dc3545; }
  /* Editor */
  .mm-hoja { background:#fff; border:1px solid var(--mm-linea); border-radius:10px; padding:28px 34px; max-width:860px; margin:auto;
             box-shadow:0 2px 10px rgba(16,24,40,.05); }
  .mm-bloque { position:relative; border:1px dashed transparent; border-radius:8px; padding:6px 8px; margin:2px 0; }
  .mm-bloque:hover, .mm-bloque.activo { border-color:#c9d3e6; background:#fbfcfe; }
  .mm-herr { position:absolute; right:4px; top:-14px; display:none; gap:2px; background:#fff; border:1px solid var(--mm-linea);
             border-radius:8px; padding:1px 3px; z-index:3; }
  .mm-bloque:hover .mm-herr, .mm-bloque.activo .mm-herr { display:flex; }
  .mm-herr button { border:none; background:none; color:var(--mm-tenue); padding:2px 6px; font-size:.85rem; }
  .mm-herr button:hover { color:var(--mm-azul); }
  .mm-edit { outline:none; min-height:1.4em; }
  .mm-edit:empty:before { content:attr(data-ayuda); color:#9aa3b2; }
  .mm-seccion { background:var(--mm-doc, var(--mm-azul)); color:#fff; font-weight:700; padding:4px 10px; border-left:6px solid #c0392b; }
  .mm-recuadro { border:1px solid #999; border-left-width:5px; border-radius:6px; padding:6px 10px; }
  .mm-recuadro.recuerda { border-color:#c9a227; background:#fff8e4; } .mm-recuadro.reto { border-color:#c0392b; background:#fdf0f1; }
  .mm-recuadro.vocabulario { border-color:#2e7d32; background:#eef7ef; } .mm-recuadro.nota { border-color:var(--mm-azul); background:#f1f4fa; }
  .mm-linea { border-bottom:1px solid #999; height:22px; }
  .mm-op { display:flex; align-items:center; gap:6px; margin:2px 0 2px 18px; }
  .mm-op input[type=text] { border:none; border-bottom:1px dotted #bbb; flex:1; outline:none; background:transparent; }
  .mm-agregar { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; padding:10px; border:1px dashed #c9d3e6; border-radius:10px; margin-top:10px; }
  .mm-agregar button { font-size:.85rem; }
  .mm-img img { max-width:100%; border-radius:4px; }
  .mm-tabla { width:100%; }
  .mm-tabla td { border:1px solid #999; padding:4px 6px; min-width:60px; vertical-align:top; height:30px; white-space:pre-wrap; }
  .mm-tabla td:focus { outline:2px solid #9ec5fe; }
  .mm-tabla.mm-privada td { background:#fff7ed; border-color:#fdba74; }
  .mm-colorbtn .mm-color-aplicar { position:relative; padding-bottom:7px; min-width:34px; }
  /* Ecuaciones: en el texto se ven como en el PDF; un clic las abre para editarlas */
  .mm-eqv { display:inline-block; cursor:pointer; padding:0 2px; border-radius:4px; user-select:all; -webkit-user-select:all; }
  .mm-eqv:hover { background:#e0ecff; outline:1px solid #93c5fd; }
  .mm-eqv img { vertical-align:middle; pointer-events:none; zoom:1.15; }
  .mm-eqv.mala { color:#b02a37; font-family:monospace; font-size:.85em; }
  .mm-eq-campo math-field { width:100%; font-size:1.6rem; border:1px solid #cbd5e1; border-radius:10px; padding:8px 10px; min-height:64px; }
  .mm-eq-campo textarea { font-size:1.1rem; }
  .mm-eq-paleta { display:flex; flex-wrap:wrap; gap:4px; }
  .mm-eq-paleta button { min-width:42px; height:36px; border:1px solid #d0d5dd; background:#fff; border-radius:8px; font-family:'Times New Roman', serif; font-size:1.05rem; padding:0 8px; }
  .mm-eq-paleta button:hover { background:#eef4ff; border-color:#93c5fd; }
  .mm-eq-paleta .grupo { width:100%; font:600 .72rem system-ui, sans-serif; color:#667085; margin-top:4px; }
  .mm-eq-previa { min-height:48px; border:1px dashed #cbd5e1; border-radius:10px; padding:10px; text-align:center; font-size:1.5rem; background:#fafafa; }
  .mm-eq-previa img { zoom:2; vertical-align:middle; }
  .mm-eq-vista { font-size:.95rem; margin:2px 0 0 28px; color:#344054; }
  .mm-eq-vista img { vertical-align:middle; zoom:1.15; }
  .mm-colorbtn .mm-a { font-weight:800; font-family:Georgia, serif; }
  .mm-colorbtn .mm-barrita { position:absolute; left:7px; right:7px; bottom:3px; height:4px; border-radius:2px; border:1px solid rgba(0,0,0,.15); }
  .mm-muestra { width:24px; height:24px; border-radius:5px; border:1px solid rgba(0,0,0,.2); padding:0; }
  .mm-muestra:hover { transform:scale(1.12); box-shadow:0 0 0 2px #93c5fd; }
  .mm-tabla tr:only-child td, .mm-tabla td:first-child:nth-last-child(2) { width:32%; font-weight:600; background:#f8fafc; }
  .mm-estado { font-size:.8rem; color:var(--mm-tenue); }
  .mm-lienzo { position:relative; margin:4px auto; user-select:none; touch-action:none; cursor:crosshair; }
  .mm-lienzo > img { display:block; width:100%; border-radius:4px; pointer-events:auto; }
  .mm-lienzo.hoja { border:1px solid #c9d3e6; }
  .mm-caja { position:absolute; border:2px solid #198754; background:rgba(25,135,84,.14); border-radius:3px; }
  .mm-caja.temporal { border-style:dashed; border-color:#0d6efd; background:rgba(13,110,253,.12); }
  .mm-caja.campo { border-color:#0d6efd; background:rgba(13,110,253,.10); cursor:pointer; overflow:hidden; }
  .mm-caja.campo.marca { border-color:#6f42c1; background:rgba(111,66,193,.10); }
  .mm-caja.campo.lista { border-color:#fd7e14; background:rgba(253,126,20,.10); }
  .mm-caja.marcado { box-shadow:0 0 0 3px #f2b632; }
  .mm-etq { position:absolute; left:2px; top:0; font-size:.7rem; font-weight:700; color:#0b3d91; white-space:nowrap; line-height:1.2; }
  .mm-quitar { position:absolute; right:-9px; top:-9px; width:18px; height:18px; border-radius:50%; border:none; background:#dc3545;
               color:#fff; font-size:12px; line-height:16px; padding:0; }
  .mm-prop { background:#fffaf0; border:1px solid #f2d27a; border-radius:8px; padding:6px 8px; outline:none; }
  .mm-prop:focus-within, .mm-prop:focus { box-shadow:0 0 0 2px #f2b632; }
  .mm-banco-item { border:1px solid var(--mm-linea); border-radius:8px; padding:8px 10px; margin-bottom:6px; }
  .mm-soltar { outline:3px dashed var(--mm-oro); outline-offset:4px; }
</style>
<style>
  .mm-medidor { background:#f4f7fc; border:1px solid var(--mm-linea, #e3e7ef); border-radius:999px; padding:4px 12px; }
  .mm-bolsa { background:#fff; border:1px solid #dfe5f0; border-radius:999px; padding:1px 8px; }
  .mm-cifra { font-size:1.6rem; font-weight:800; color:#1f3a68; line-height:1.1; }
  .mm-cifra small { font-size:.85rem; font-weight:600; color:#6b7280; }
  .mm-estrellas { color:#f2b632; }
  .mm-ficha-bib { border:1px solid var(--mm-linea, #e3e7ef); border-radius:12px; padding:12px 14px; background:#fff; height:100%; display:flex; flex-direction:column; }
  .mm-ficha-bib .t { font-weight:700; color:#1f3a68; }
  .mm-sello { font-size:.72rem; border-radius:999px; padding:1px 8px; font-weight:700; }
  .mm-sello.libre { background:#fff4d6; color:#7a5300; } .mm-sello.comunidad { background:#e5efff; color:#0b3d91; }
  .mm-sello.colegio { background:#e7f6ec; color:#14532d; } .mm-sello.revision, .mm-sello.oculto { background:#f1f1f1; color:#555; }
  .mm-sello.rechazado { background:#fde8ea; color:#842029; }
  .mm-cambio { border:1px solid var(--mm-linea, #e3e7ef); border-radius:8px; padding:8px 10px; margin-bottom:6px; }
  .mm-cambio del { color:#b02a37; } .mm-cambio ins { color:#14532d; text-decoration:none; }
</style>
