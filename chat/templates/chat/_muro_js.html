<script>
(function () {
  function token() { var m = document.cookie.match(/csrftoken=([^;]+)/); var i = document.querySelector('[name=csrfmiddlewaretoken]'); return i ? i.value : (m ? m[1] : ''); }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button.mu-r[data-tipo]');
    if (b) {
      var fd = new FormData(); fd.append('tipo', b.dataset.tipo);
      fetch('/chat/colegas/muro/' + b.dataset.pub + '/reaccion/', {method: 'POST', body: fd, headers: {'X-CSRFToken': token(), 'X-Requested-With': 'fetch'}})
        .then(function (r) { return r.json(); }).then(function (j) {
          if (!j.ok) return; b.classList.toggle('on', j.activa);
          var s = b.querySelector('span:not(.d-none):not(.d-sm-inline)'); if (s && b.dataset.tipo !== 'guardar') s.textContent = j.n || '';
        });
      return;
    }
    var jugar = e.target.closest('.mu-jugar');
    if (jugar) {
      var caja = document.getElementById('jugar-' + jugar.dataset.pub);
      if (!caja.querySelector('iframe')) {
        var f = document.createElement('iframe');
        f.setAttribute('sandbox', jugar.dataset.sandbox); f.src = jugar.dataset.src; f.title = 'Actividad'; f.setAttribute('allow', 'fullscreen; autoplay');
        f.setAttribute('allowfullscreen', ''); caja.querySelector('.mu-pantalla').appendChild(f);
      }
      caja.classList.remove('d-none'); jugar.classList.add('d-none');
      return;
    }
    var completa = e.target.closest('.mu-completa');
    if (completa) {
      var cj = document.getElementById('jugar-' + completa.dataset.pub);
      if (cj.classList.contains('d-none')) { var bj = document.querySelector('.mu-jugar[data-pub="' + completa.dataset.pub + '"]'); if (bj) bj.click(); }
      var el = cj.querySelector('.mu-pantalla');
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      return;
    }
    var d = e.target.closest('.mu-descartar');
    if (d) {
      var f2 = new FormData(); f2.append('usuario', d.dataset.u);
      fetch('/chat/colegas/muro/descartar/', {method: 'POST', body: f2, headers: {'X-CSRFToken': token(), 'X-Requested-With': 'fetch'}})
        .then(function () { var x = document.getElementById('sug-' + d.dataset.u); if (x) x.remove(); });
    }
  });
  var form = document.getElementById('mu-form'), abrir = document.getElementById('mu-abrir');
  if (!form) return;
  var AYUDA = {actividad: 'Comparta un juego o una actividad HTML que hizo: los colegas la juegan aquí, en pantalla completa, y la pueden copiar.',
    recurso: 'Comparta una guía de Mis materiales (sus colegas la ven en PDF y la pueden copiar) o el enlace de un recurso.',
    consulta: 'Pregunte a la comunidad. Usted elige la respuesta más útil.',
    experiencia: 'Qué hizo, qué funcionó y qué cambiaría.',
    convocatoria: 'Olimpiadas, congresos, becas, revistas… Con fecha límite: deja de salir cuando vence.',
    lectura: 'Un artículo o libro y una frase de por qué vale la pena.'};
  function tipo() { var t = form.querySelector('[name=tipo]:checked'); return t ? t.value : ''; }
  function ver() {
    form.querySelectorAll('.mu-solo').forEach(function (x) { x.classList.toggle('d-none', x.dataset.para !== tipo()); });
    document.getElementById('mu-ayuda').textContent = AYUDA[tipo()] || '';
    form.texto.placeholder = tipo() === 'consulta' ? '¿Qué le gustaría preguntarles a sus colegas?' : 'Cuéntele a sus colegas…';
  }
  form.addEventListener('change', ver); ver();
  if (abrir) abrir.addEventListener('click', function () { abrir.classList.add('d-none'); form.classList.remove('d-none'); form.titulo.focus(); });
  document.getElementById('mu-cancelar').addEventListener('click', function () { form.classList.add('d-none'); if (abrir) abrir.classList.remove('d-none'); });
  document.getElementById('mu-img').addEventListener('change', function () {
    var hay = this.files.length > 0; document.getElementById('mu-sin-est').classList.toggle('d-none', !hay); document.getElementById('mu-se').required = hay;
  });
  var pg = form.querySelector('[name=pagina]');
  function tituloDeActividad() { if (pg && pg.value && !form.titulo.value) form.titulo.value = pg.options[pg.selectedIndex].text; }
  if (pg) { pg.addEventListener('change', tituloDeActividad); tituloDeActividad(); }
  var doc = form.querySelector('[name=documento]');
  if (doc) doc.addEventListener('change', function () { if (doc.value && !form.titulo.value) form.titulo.value = doc.options[doc.selectedIndex].text.split(' · ')[0]; });
})();
</script>
