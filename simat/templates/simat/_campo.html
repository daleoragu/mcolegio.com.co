<div class="{{ ancho|default:'col-md-3' }}">{% if campo.field.widget.input_type == 'checkbox' %}
    <div class="form-check mt-4">{{ campo }}<label class="form-check-label small" for="{{ campo.id_for_label }}">{{ campo.label }}</label></div>
{% else %}<label class="form-label small fw-semibold mb-1" for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}{% endif %}
{% if campo.help_text %}<div class="sm-ayuda">{{ campo.help_text }}</div>{% endif %}{% for e in campo.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
