{% if componentes %}
<div class="row g-2 mb-2">
    <div class="col-6">
        <label class="form-label small fw-bold mb-1">Periodo</label>
        <select name="periodo" class="form-select form-select-sm">
            <option value="">—</option>
            {% for p in periodos %}<option value="{{ p.id }}" {% if obj and obj.periodo_id %}{% if p.id == obj.periodo_id %}selected{% endif %}{% elif p == periodo_sugerido %}selected{% endif %}>{{ p }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-6">
        <label class="form-label small fw-bold mb-1">Componente</label>
        <select name="componente" class="form-select form-select-sm">
            <option value="">—</option>
            {% for k, n in componentes %}<option value="{{ k }}" {% if obj and obj.componente == k %}selected{% endif %}>{{ n }}</option>{% endfor %}
        </select>
    </div>
</div>
{% endif %}
