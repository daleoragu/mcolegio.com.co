{% comment %}Cuenta en vivo las preguntas que va pegando el docente (la misma regla que aula/invertida.py, simplificada).{% endcomment %}
<script>
(function () {
  var NUM = /^\s*(?:pregunta\s*)?\d{1,3}\s*[.)\-:]\s*/i, OP = /^\s*\*?\s*[A-Ha-h][).\-:]\s+\S/, RESP = /^\s*(ANSWER|RESPUESTA|CORRECTA)\s*[:=]/i;
  function contar(texto) {
    var preguntas = 0, seleccion = 0, abierta = false, enPregunta = false, conOpciones = false;
    function cerrar() { if (enPregunta) { preguntas++; if (conOpciones) seleccion++; } enPregunta = false; conOpciones = false; }
    texto.split(/\r?\n/).forEach(function (l) {
      if (!l.trim()) { cerrar(); return; }
      if (RESP.test(l)) { cerrar(); return; }
      if (OP.test(l) && enPregunta) { conOpciones = true; return; }
      if (NUM.test(l) || !enPregunta || conOpciones) { cerrar(); enPregunta = true; }
    });
    cerrar();
    return [preguntas, seleccion];
  }
  document.querySelectorAll('.inv-preguntas').forEach(function (ta) {
    var salida = ta.parentNode.querySelector('.inv-cuenta');
    function pintar() {
      var n = contar(ta.value);
      salida.textContent = n[0] ? n[0] + ' pregunta' + (n[0] === 1 ? '' : 's') + ': ' + n[1] + ' de selección y ' + (n[0] - n[1]) + ' abierta' + (n[0] - n[1] === 1 ? '' : 's') + '.' : '';
    }
    ta.addEventListener('input', pintar); pintar();
  });
})();
</script>
